{% extends "base.html" %}

{% block title %}{{ super() }} - Publicar noticia{% endblock %}

{% block content %}
<div class="form-card">
    <h2 style="margin-bottom: 1.5rem; color: var(--text);">Publicar noticia / información</h2>

    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="title">Título de la noticia</label>
            <input type="text" id="title" name="title" required placeholder="Ej: Nuevo hallazgo científico en...">
        </div>
        <div class="form-group">
            <label for="content">Contenido / artículo</label>
            <textarea id="content" name="content" rows="8" required placeholder="Escribe aquí el texto completo de la noticia..."></textarea>
        </div>
        <div class="form-group">
            <label for="image">Imagen (opcional)</label>
            <input type="file" id="image" name="image" class="file-input" accept="image/*">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Publicar noticia</button>
    </form>

    <p style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
        Solo usuarios con rol de <strong>Calificador</strong> o <strong>Creador</strong> pueden publicar.
    </p>
</div>
{% endblock %}
