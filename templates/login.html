{% extends "base.html" %}

{% block title %}{{ super() }} - Iniciar sesión{% endblock %}

{% block content %}
<div class="form-card">
    <h2 style="margin-bottom: 1.5rem; color: var(--text);">Iniciar sesión</h2>

    <form method="POST">
        <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" required placeholder="tucorreo@ejemplo.com">
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Ingresar</button>
    </form>

    <p style="margin-top: 1.5rem; text-align: center; color: var(--text-muted); font-size: 0.9rem;">
        ¿No tienes cuenta? <a href="{{ url_for('register') }}">Regístrate aquí</a>
    </p>
</div>
{% endblock %}
